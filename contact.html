s<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dhina Travels Gallery</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body{
        font-family: Georgia, 'Times New Roman', Times, serif;
        background-image: linear-gradient(rgba(0,0,0,0.55),rgba(0,0,0,0.55)),url(background.jpeg);
        background-size: cover;
        background-position: center;
    }
    .navbar{
        background-color: black;
    }
    .navbar-brand{
        color: aqua;
        font-size: 50px;
        font-weight: bolder;
    }
    .nav-link{
        color: white !important;
        font-size: 20px;
        margin-left: 15px;
    }
    .nav-link:hover{
        color: red !important;
    }
    .slider{
        width: 50%;
        margin:30px auto;
    }
    .carousel-item img{
        width:100%;
        height:300px;
        object-fit:cover;
        border-radius:15px;
        border: black;
        box-shadow: black;
    }
    .contact-section{
    padding:50px 20px;
    text-align:center;
    }
    .contact-section h1{
        text-align:center;
        font-size:45px;
        color:#07e6cf;
        margin-bottom:30px;
        position:relative;
        font-weight: bolder;
    }
    .contact-section h1::after{
        content:'';
        width:80px;
        height:4px;
        background:#04f0d8;
        display:block;
        margin:10px auto;
        border-radius:10px;
    }
    .contact-container{
        display:flex;
        justify-content:center;
        gap:25px;
        flex-wrap:wrap;
        margin-bottom:40px;
    }
    .contact-card{
        width:250px;
        background:white;
        padding:25px;
        text-align:center;
        border-radius:20px;
        box-shadow:0 5px 15px rgba(3, 250, 250, 0.15);
        transition:0.5s;
    }
    .contact-card:hover{
        transform:translateY(-10px);
    }
    .contact-card h3{
        color:#009688;
        margin-bottom:10px;
    }
    .quote{
        text-align:center;
        font-size:20px;
        margin-bottom:20px;
        font-style:italic;
    }
    .contact-form{
        width:60%;
        margin:auto;
        background:white;
        padding:30px;
        position: relative
        z-index:1000;
        border-radius:20px;
        box-shadow:0 5px 20px rgba(0,0,0,0.15);
        border: 3px solid #04ffe6;
    }
    .contact-form h2{
        text-align:center;
        margin-bottom:20px;
        color:#333;
    }
    .contact-form input,
    .contact-form textarea{
        width:100%;
        padding:12px;
        margin:10px 0;
        border:1px solid #ddd;
        border-radius:10px;
    }
    .contact-form button{
        width:100%;
        padding:12px;
        border:none;
        border-radius:30px;
        font-size:18px;
        color:white;
        cursor:pointer;
        background:linear-gradient(45deg,#00f335,#018a8f);
    }
    .contact-form button:hover{
        opacity:0.9;
    }
    footer{
        background:black;
        color:white;
        text-align:center;
        padding:20px;
        margin-top:40px;
    }
    </style>
</head>
<body>

                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item"><a class="nav-link" href="booking.html">Booking</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

                <div class="carousel-item">

                <div class="carousel-item">

            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#busSlider" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#busSlider" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>
