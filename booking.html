<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dhina Tours & Travels</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <style> 
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            font-family: Georgia, 'Times New Roman', Times, serif;
            background-image: linear-gradient(rgba(0,0,0,0.55),rgba(0,0,0,0.55)),url(bus.jpeg);
            background-size: cover;
            background-position: center;
        }
        .navbar{
            background-color: black;
        }
        .navbar-brand{
            color: aqua;
            font-size: 50px;
            font-weight: bolder;
        }
        .nav-link{
            color: white !important;
            font-size: 20px;
            margin-left: 15px;
        }
        .nav-link:hover{
            color: red !important;
        }
        .booking{
            width:90%;
            max-width:600px;
            margin:40px auto;
            padding:25px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
            backdrop-filter: BLUR(8PX);
            border: 3PX solid white;
            box-shadow: 0 0 20PX rgba(255,225,225,0.8);
        }
        .booking h2{
            text-align:center;
            color:#06deee;
            border: #0077cc;
            font-weight: bolder;
        }
        .booking input,.booking select,.booking textarea{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:1px solid #fff;
            border-radius:5px;
            box-sizing:border-box;
        }
        .booking button{
            width:100%;
            padding:12px;
            background:#0077cc;
            color:white;
            border:none;
            border-radius:5px;
            font-size:16px;
            cursor:pointer;
        }
        .booking button:hover{
            background:#005fa3;
        }
        </style>
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container">
                <a class="navbar-brand">Dhina Travels</a>
                <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menu">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="facilities.html">Facilities</a></li>
                        <li class="nav-item"><a class="nav-link" href="booking.html">Booking</a></li>
                        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    </ul>
                </div>
            </div>
        </nav> 
        <div class="booking">
            <h2>Book Your Trip</h2>
            <form onsubmit="bookTrip(event)">
                <input type="text" placeholder="Full Name" required>
                <input type="tel" placeholder="Mobile Number" required>
                <input type="email" placeholder="Email Address" required>
                <select required>
                    <option value="">Select Booking Type</option>
                    <option>Family Tour Package</option>
                    <option>Travels Booking</option>
                </select>
                <select required>
                    <option value="">Select Tour Package / Destination</option>
                    <option>Ooty Tour</option>
                    <option>Kodaikanal Tour</option>
                    <option>Coimbatore Tour</option>
                    <option>Madurai Tour</option>
                    <option>Trichy Tour</option>
                    <option>Rameswaram Tour</option>
                    <option>Custom Tour Package</option>
                </select>
                <select required>
                    <option value="">Select Vehicle</option>
                    <option>Car</option>
                    <option>SUV</option>
                    <option>Tempo Traveller</option>
                    <option>Mini Bus</option>
                    <option>Tourist Bus</option>
                </select>
                <input type="text" placeholder="Pickup Location" required>
                <input type="text" placeholder="Drop Location" required>
                <input type="date" required>
                <input type="number" placeholder="Number of Persons" required>
                <textarea rows="4" placeholder="Special Requirements"></textarea>
                <button type="submit">Book Now</button>
            </form>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>
        function bookTrip(event){
            event.preventDefault();
            alert("Booking Submitted Successfully!");
        }
        </script>
    </body>
</html>
